<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="2画面配置を上から見た図：主従型と均等V型の比較">
  <title>2画面配置の上面図（主従型 / 均等V型）</title>
  <desc>配置は使用比率に合わせる。均等に並べてよいのは均等に使う場合だけ。</desc>
  <style>
    .scr  { stroke: #4a86c8; stroke-width: 6; fill: none; stroke-linecap: round; }
    .scr2 { stroke: #6b7590; stroke-width: 6; fill: none; stroke-linecap: round; opacity: .75; }
    .body { stroke: #6b7590; stroke-width: 1.6; fill: none; }
    .mid  { stroke: #6b7590; stroke-width: 1; fill: none; stroke-dasharray: 3 5; opacity: .8; }
    .gaze { stroke: #d98b3a; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; }
    .t    { font-family: system-ui, sans-serif; font-size: 13px; fill: #6b7590; }
    .tk   { font-family: system-ui, sans-serif; font-size: 14px; fill: #4a86c8; font-weight: 700; }
    .ts   { font-family: system-ui, sans-serif; font-size: 13px; fill: #8b95b0; font-weight: 700; }
    .tg   { font-family: system-ui, sans-serif; font-size: 13px; fill: #d98b3a; font-weight: 700; }
    .cap  { font-family: system-ui, sans-serif; font-size: 15px; fill: #8b95b0; font-weight: 700; }
  </style>

  <!-- ===================== 主従型 ===================== -->
  <g>
    <text class="cap" x="20" y="26">主従型 — 片方をはっきり主に使うなら</text>

    <!-- 身体の正中線 -->
    <line class="mid" x1="225" y1="247" x2="225" y2="52"/>
    <text class="t" x="231" y="66">正中線</text>

    <!-- 主画面（正面） -->
    <line class="scr" x1="180" y1="105" x2="270" y2="105"/>
    <text class="tk" x="182" y="94">主（MBP 14）</text>

    <!-- 従画面（右・内向き） -->
    <line class="scr2" x1="300" y1="97" x2="370" y2="153"/>
    <text class="ts" x="306" y="82">従</text>

    <!-- 視線 -->
    <line class="gaze" x1="225" y1="247" x2="225" y2="115"/>
    <line class="gaze" x1="225" y1="247" x2="331" y2="128"/>
    <text class="tg" x="252" y="196">首は正面のまま</text>
    <text class="tg" x="252" y="214">が大半になる</text>

    <!-- 人（上から） -->
    <circle class="body" cx="225" cy="265" r="18"/>
    <path class="body" d="M217 250 L225 240 L233 250" fill="#6b7590" fill-opacity=".2"/>

    <text class="t" x="20" y="310">正面を空けないこと。均等に並べると、どちらを見ても首が回った状態になる</text>
  </g>

  <line x1="460" y1="16" x2="460" y2="314" stroke="#6b7590" stroke-width="1" stroke-dasharray="4 6" opacity=".5"/>

  <!-- ===================== 均等V型 ===================== -->
  <g transform="translate(470,0)">
    <text class="cap" x="20" y="26">均等V型 — 両方をほぼ均等に使うなら</text>

    <line class="mid" x1="225" y1="247" x2="225" y2="52"/>
    <text class="t" x="231" y="66">正中線</text>

    <!-- 2画面を正中線で突き合わせ、内向きに振る -->
    <line class="scr" x1="225" y1="100" x2="140" y2="128"/>
    <line class="scr" x1="225" y1="100" x2="310" y2="128"/>

    <!-- 視線 -->
    <line class="gaze" x1="225" y1="247" x2="182" y2="122"/>
    <line class="gaze" x1="225" y1="247" x2="268" y2="122"/>
    <text class="tg" x="150" y="180">左右とも</text>
    <text class="tg" x="150" y="198">同じ小さい角度</text>

    <circle class="body" cx="225" cy="265" r="18"/>
    <path class="body" d="M217 250 L225 240 L233 250" fill="#6b7590" fill-opacity=".2"/>

    <text class="t" x="20" y="310">代償は「正面に画面が無い」こと。境目を見続ける作業でなければ主従型が楽</text>
  </g>
</svg>
